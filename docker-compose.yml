# ===========================================================
# Docker Compose — Jurnal Guru Online
# Stack deployment for home server (Ubuntu/Proxmox)
# ===========================================================
# Usage:
#   1. Copy .env.example to .env and fill in Firebase values
#   2. Run: docker compose up -d --build
# ===========================================================

services:
  jurnal-guru-app:
    container_name: jurnal-guru-app
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
    ports:
      - "8080:3000"
    environment:
      - NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyDaGUPhTcg5DRUTCe7WMsoiYsqBj-ZeT5M
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=jurnal-guru-online.firebaseapp.com
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=jurnal-guru-online
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=jurnal-guru-online.firebasestorage.app
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=992915465985
      - NEXT_PUBLIC_FIREBASE_APP_ID=1:992915465985:web:d0abe011f067eb64079d00

    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
